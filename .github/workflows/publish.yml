name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Verify CI for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          RESULT=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&branch=main&per_page=1" --jq '.workflow_runs[0].conclusion // "missing"')
          if [ "$RESULT" != success ]; then
            echo "::error::The release commit must have successful CI on main."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Set package version from the release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a vX.Y.Z release tag."
            exit 1
          fi
          npm version "${RELEASE_TAG#v}" --no-git-tag-version --ignore-scripts --allow-same-version

      - name: Run all tests
        run: npm test

      - name: Check package contents
        run: npm pack --dry-run

      - name: Publish package
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "kysaro@$VERSION" version > /dev/null 2>&1; then
            echo "kysaro@$VERSION is already on npm, skipping"
            exit 0
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
